<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loket Iuran Sampah - BUMDES SEA TUMPENGAN</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0F5C4D"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--g:#0F5C4D;--g2:#E1EFEA;--ink:#1B2A27;--bg:#EDF1F0;--amb:#E9A23B;--line:#D3DDDA;--red:#B3382C}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select{font:inherit}input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;margin:4px 0 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--amb);outline-offset:1px}
label{font-size:13px;font-weight:600;color:#445853}
button{background:var(--g);color:#fff;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:600}
button.o{background:#fff;color:var(--g);border:1px solid var(--g)}button.d{background:var(--red)}button.s{padding:5px 10px;font-size:13px}
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lv{background:var(--g);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:flex-end}
.lv h1{font-size:40px;line-height:1.1;margin:0 0 10px;letter-spacing:-.5px}.lv p{margin:0;opacity:.8;max-width:340px}
.lf{display:flex;align-items:center;justify-content:center;padding:24px}.lf form{width:100%;max-width:340px}
.lf h2{margin:0 0 18px}.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px}
header{background:var(--g);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 22px;flex-wrap:wrap}
header b{font-size:17px}header .sp{flex:1}header button{background:rgba(255,255,255,.14)}
nav{display:flex;gap:4px;background:#fff;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;color:var(--ink);border-radius:0;padding:13px 16px;border-bottom:3px solid transparent}
nav button.on{color:var(--g);border-color:var(--amb)}
main{padding:20px;max-width:1150px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:18px}.card h2{margin:0 0 14px;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--g2);text-align:left;padding:8px 10px}td{padding:8px 10px;border-bottom:1px solid var(--line)}
.r{text-align:right}.wrap{overflow-x:auto}.row{display:flex;gap:12px}.row>*{flex:1}
.item{padding:9px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between}.item:hover{background:var(--g2)}
.big{font-size:28px;font-weight:700;color:var(--g)}.sum{display:flex;gap:28px;margin:12px 0}.sum small{display:block;color:#5d706b}
.tag{background:var(--g2);color:var(--g);padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}.mut{color:#5d706b;font-size:13px}
#struk{display:none;font-family:"Courier New",monospace;font-size:12px;color:#000}
#struk .c{text-align:center}#struk hr{border:0;border-top:1px dashed #000;margin:6px 0}#struk .b{display:flex;justify-content:space-between}
@media print{body>*:not(#struk){display:none!important}#struk{display:block;width:72mm}@page{size:80mm auto;margin:3mm}}
@media(max-width:760px){#login,.grid{grid-template-columns:1fr}.lv{padding:28px;min-height:180px}.lv h1{font-size:28px}}
</style></head><body>
<div id="login"><div class="lv"><h1>Loket Iuran Sampah</h1><p>BUMDES SEA TUMPENGAN. Catat pembayaran, cetak struk, dan unduh laporan dalam satu tempat.</p></div>
<div class="lf"><form onsubmit="masuk();return false"><h2>Masuk</h2><label>Username</label><input id="lu" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required><label>Password</label><input id="lp" type="password" autocomplete="current-password" autocapitalize="off" required><label style="font-weight:400"><input type="checkbox" style="width:auto;margin:0 6px 0 0" onchange="$('lp').type=this.checked?'text':'password'">Tampilkan password</label><div class="err" id="le"></div><button style="width:100%">Masuk</button><p class="mut">Company by: glifmichael82@gmail.com</p><div id="fa"></div><p class="mut" style="font-size:12px"><a href="#" onclick="setupFb();return false">Ubah sambungan database</a></p></form></div></div>
<div id="app" style="display:none"><header><img id="hl" alt="" style="height:34px;display:none;border-radius:4px;background:#fff;padding:2px"><b id="hn"></b><span class="sp"></span><span id="hu"></span><button onclick="keluar()">Keluar</button></header><nav id="nv"></nav><main id="view"></main></div>
<div id="struk"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
function h(s){let x=5381;for(const c of s)x=(x*33^c.charCodeAt(0))>>>0;return x.toString(36)}
const K='sampah_bumdes_db',$=i=>document.getElementById(i);
let db={users:[],warga:[],bayar:[],set:{nama:'BUMDES SEA TUMPENGAN',alamat:'Alamat BUMDES',tarif:15000,footer:'Terima kasih atas pembayaran Anda'}};

const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const BL=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const bln=ym=>BL[+ym.slice(5)-1]+' '+ym.slice(0,4);
function addM(ym,n){let y=+ym.slice(0,4),m=+ym.slice(5)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')}
const now=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,19);
let me=null,cur='kasir',sel=null;
const TABS={admin:[['kasir','Kasir'],['warga','Data Warga'],['laporan','Laporan'],['tunggakan','Tunggakan'],['pengguna','Pengguna'],['pengaturan','Pengaturan']],kasir:[['kasir','Kasir']]};
async function masuk(){const u=$('lu').value.trim().toLowerCase(),p=$('lp').value;$('le').textContent='Memeriksa...';
 try{const m=await FS.collection('uname').doc(u).get();if(!m.exists)throw 0;await AUTH.signInWithEmailAndPassword(m.data().email,p);$('le').textContent=''}catch(x){$('le').textContent='Username atau password salah.'}}
function keluar(){AUTH.signOut();$('lp').value=''}
function start(){if(!me)return;$('login').style.display='none';$('app').style.display='block';$('hn').textContent=db.set.nama;setLogo();$('hu').textContent=me.n+' ('+(me.r=='admin'?'Admin':'Kasir')+')';go('kasir')}
function go(t){if(!TABS[me.r].some(x=>x[0]==t))return;cur=t;sel=null;$('nv').innerHTML=TABS[me.r].map(x=>`<button class="${x[0]==t?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');V[t]()}
const V={};
V.kasir=()=>{$('view').innerHTML=`<div class="grid"><section class="card"><h2>Pembayaran Iuran</h2><label>Cari warga (nama atau ID)</label><input id="q" oninput="cari()" placeholder="Ketik nama atau ID" autofocus><div id="hasil"></div><div id="form"></div></section><section class="card"><h2>Transaksi hari ini</h2><div id="hari"></div></section></div>`;cari();hari()};
function cari(){const q=$('q').value.toLowerCase();const l=db.warga.filter(w=>!q||w.nama.toLowerCase().includes(q)||w.id.toLowerCase().includes(q)).slice(0,6);
 $('hasil').innerHTML=db.warga.length?l.map(w=>`<div class="item" onclick="pilih('${w.id}')"><span>${e(w.nama)} <span class="mut">${e(w.alamat)}</span></span><span class="tag">${w.id}</span></div>`).join('')||'<p class="mut">Warga tidak ditemukan.</p>':'<p class="mut">Belum ada data warga. Minta admin menambahkannya di menu Data Warga.</p>'}
function pilih(id){sel=db.warga.find(w=>w.id==id);const ps=db.bayar.filter(b=>b.wid==id).flatMap(b=>b.periode).sort();
 const next=ps.length?addM(ps[ps.length-1],1):(sel.mulai||now().slice(0,7));
 $('form').innerHTML=`<hr style="border:0;border-top:1px solid var(--line)"><p><b>${e(sel.nama)}</b><br><span class="mut">${e(sel.alamat)} · Tarif ${rp(sel.tarif)}/bulan · ${ps.length?'Terakhir lunas '+bln(ps[ps.length-1]):'Belum pernah bayar'}</span></p>
 <div class="row"><div><label>Mulai bulan</label><input type="month" id="mb" value="${next}" oninput="hit()"></div><div><label>Jumlah bulan</label><input type="number" id="jb" min="1" max="24" value="1" oninput="hit()"></div></div>
 <div class="sum"><div><small>Total tagihan</small><span class="big" id="tt"></span></div></div>
 <label>Uang diterima (Rp)</label><input type="number" id="tn" min="0" oninput="hit()"><p>Kembalian: <b id="kb">Rp 0</b></p><div class="err" id="er"></div><button onclick="bayar()">Simpan dan cetak struk</button>`;hit()}
function per(){const m=$('mb').value,n=+$('jb').value||1;return m?Array.from({length:n},(_,i)=>addM(m,i)):[]}
function hit(){const t=per().length*sel.tarif;$('tt').textContent=rp(t);$('kb').textContent=rp(Math.max(0,(+$('tn').value||0)-t))}
function bayar(){const p=per(),t=p.length*sel.tarif,tn=+$('tn').value||0;
 const dup=p.filter(x=>db.bayar.some(b=>b.wid==sel.id&&b.periode.includes(x)));
 if(!p.length)return $('er').textContent='Pilih bulan mulai.';
 if(dup.length)return $('er').textContent='Sudah lunas: '+dup.map(bln).join(', ')+'.';
 if(tn<t)return $('er').textContent='Uang diterima kurang dari total tagihan.';
 const d=now(),c=db.bayar.filter(b=>b.tgl.slice(0,10)==d.slice(0,10)).length+1;
 const no='SMP'+d.slice(0,10).replace(/-/g,'')+'-'+String(c).padStart(3,'0')+Math.random().toString(36).slice(2,4).toUpperCase();
 db.bayar.push({no,tgl:d,wid:sel.id,nama:sel.nama,alamat:sel.alamat,periode:p,jumlah:t,tunai:tn,kasir:me.n});save();cetak(no);V.kasir()}
function hari(){const d=now().slice(0,10),l=db.bayar.filter(b=>b.tgl.slice(0,10)==d&&(me.r=='admin'||b.kasir==me.n)).reverse();
 $('hari').innerHTML=`<div class="sum"><div><small>Transaksi</small><b class="big">${l.length}</b></div><div><small>Total masuk</small><b class="big">${rp(l.reduce((s,b)=>s+b.jumlah,0))}</b></div></div><div class="wrap"><table><tr><th>No. struk</th><th>Warga</th><th class="r">Jumlah</th><th></th></tr>${l.map(b=>`<tr><td>${b.no}</td><td>${e(b.nama)}</td><td class="r">${rp(b.jumlah)}</td><td><button class="o s" onclick="cetak('${b.no}',0,1)">Cetak ulang</button>${me.r=='admin'?` <button class="d s" onclick="hapusT('${b.no}')">Hapus</button>`:''}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">Belum ada transaksi.</td></tr>'}</table></div>`}
function cetak(no,force,salin){const b=db.bayar.find(x=>x.no==no)||LP.find(x=>x.no==no),s=db.set;if(bt.dev&&!force){btSend(escpos(b,salin)).catch(x=>{alert('Gagal cetak lewat Bluetooth: '+x.message+'\nStruk dicetak lewat menu cetak HP.');cetak(no,1,salin)});return}
 $('struk').innerHTML=`${s.logo?`<div class="c"><img src="${s.logo}" style="max-width:40mm;max-height:20mm"></div>`:''}<div class="c"><b style="font-size:14px">${e(s.nama)}</b><br>${e(s.alamat)}<br>STRUK IURAN SAMPAH</div><hr>
 <div>No : ${b.no}</div><div>Tgl: ${b.tgl.slice(8,10)}/${b.tgl.slice(5,7)}/${b.tgl.slice(0,4)} ${b.tgl.slice(11,16)}</div><div>Kasir: ${e(b.kasir)}</div><hr>
 <div>ID : ${b.wid}</div><div>Nama: ${e(b.nama)}</div><div>Alamat: ${e(b.alamat)}</div><div>Periode: ${b.periode.map(bln).join(', ')}</div><hr>
 <div class="b"><span>Total</span><b>${rp(b.jumlah)}</b></div><div class="b"><span>Tunai</span><span>${rp(b.tunai)}</span></div><div class="b"><span>Kembali</span><span>${rp(b.tunai-b.jumlah)}</span></div><hr>
 <div class="c">${e(s.footer)}<br>*** LUNAS ***${salin?'<br>(SALINAN - CETAK ULANG)':''}</div>`;setTimeout(()=>window.print(),100)}
V.warga=()=>{$('view').innerHTML=`<div class="grid"><section class="card"><h2 id="wt">Tambah warga</h2><input type="hidden" id="wi"><label>Nama</label><input id="wn"><label>Alamat / dusun</label><input id="wa"><label>Tarif per bulan (Rp)</label><input type="number" id="wr" value="${db.set.tarif}"><label>Mulai iuran (bulan)</label><input type="month" id="wm" value="${now().slice(0,7)}"><button onclick="simpanW()">Simpan warga</button> <button class="o" onclick="V.warga()">Batal</button></section><section class="card"><h2>Daftar warga (${db.warga.length})</h2><div class="wrap"><table><tr><th>ID</th><th>Nama</th><th class="r">Tarif</th><th></th></tr>${db.warga.map(w=>`<tr><td>${w.id}</td><td>${e(w.nama)}<br><span class="mut">${e(w.alamat)}</span></td><td class="r">${rp(w.tarif)}</td><td><button class="o s" onclick="editW('${w.id}')">Ubah</button> <button class="d s" onclick="hapusW('${w.id}')">Hapus</button></td></tr>`).join('')}</table></div></section></div>`};
function simpanW(){const n=$('wn').value.trim();if(!n)return alert('Nama wajib diisi.');const o={nama:n,alamat:$('wa').value.trim(),tarif:+$('wr').value||0,mulai:$('wm').value};
 if($('wi').value)Object.assign(db.warga.find(w=>w.id==$('wi').value),o);else{const m=Math.max(0,...db.warga.map(w=>+w.id.slice(1)));db.warga.push({id:'W'+String(m+1).padStart(4,'0'),...o})}save();V.warga()}
function editW(id){const w=db.warga.find(x=>x.id==id);$('wt').textContent='Ubah warga';$('wi').value=id;$('wn').value=w.nama;$('wa').value=w.alamat;$('wr').value=w.tarif;$('wm').value=w.mulai||now().slice(0,7)}
function hapusW(id){if(confirm('Hapus warga ini? Riwayat pembayarannya tetap tersimpan.')){db.warga=db.warga.filter(w=>w.id!=id);save();V.warga()}}
V.laporan=()=>{const d=now().slice(0,10);$('view').innerHTML=`<section class="card"><h2>Laporan Pembayaran</h2><div class="row"><div><label>Dari tanggal</label><input type="date" id="d1" value="${d.slice(0,8)}01" oninput="lap()"></div><div><label>Sampai tanggal</label><input type="date" id="d2" value="${d}" oninput="lap()"></div><div><label>Kasir</label><select id="kk" onchange="lap()"><option value="">Semua kasir</option>${[...new Set(db.bayar.map(b=>b.kasir))].map(k=>`<option>${e(k)}</option>`).join('')}</select></div></div><div id="lr"></div></section>`;lap()};
let LP=[],lapId=0;
const wStart=()=>addM(now().slice(0,7),-12)+'-01';
const flt=()=>LP;
async function lap(){const my=++lapId,a=$('d1').value,b=$('d2').value,k=$('kk').value;let rows=db.bayar;
 if(a&&a<wStart()){$('lr').innerHTML='<p class="mut">Memuat data lama dari server...</p>';try{const q=await FS.collection('bayar').where('tgl','>=',a).where('tgl','<=',b+'T23:59:59').get();rows=q.docs.map(d=>d.data())}catch(x){er(x)}}
 if(my!==lapId)return;
 LP=rows.filter(x=>x.tgl.slice(0,10)>=a&&x.tgl.slice(0,10)<=b&&(!k||x.kasir==k)).sort((p,q)=>p.tgl<q.tgl?-1:p.tgl>q.tgl?1:0);const l=LP;
 $('lr').innerHTML=`<div class="sum"><div><small>Jumlah transaksi</small><b class="big">${l.length}</b></div><div><small>Total penerimaan</small><b class="big">${rp(l.reduce((s,b)=>s+b.jumlah,0))}</b></div></div><button onclick="unduh()">Unduh laporan Excel</button><div class="wrap" style="margin-top:14px"><table><tr><th>No. struk</th><th>Tanggal</th><th>Warga</th><th>Periode</th><th class="r">Jumlah</th><th>Kasir</th><th></th></tr>${l.map(b=>`<tr><td>${b.no}</td><td>${b.tgl.slice(0,10)}</td><td>${e(b.nama)}</td><td>${b.periode.map(bln).join(', ')}</td><td class="r">${rp(b.jumlah)}</td><td>${e(b.kasir)}</td><td><button class="o s" onclick="cetak('${b.no}',0,1)">Cetak ulang</button> <button class="d s" onclick="hapusT('${b.no}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan=7 class="mut">Tidak ada transaksi pada filter ini.</td></tr>'}</table></div>`}
function unduh(){const l=flt(),s=db.set,tot=l.reduce((a,b)=>a+b.jumlah,0),ks={};l.forEach(b=>ks[b.kasir]=(ks[b.kasir]||0)+b.jumlah);
 const H=['No','No. Struk','Tanggal','Jam','ID Warga','Nama Warga','Alamat','Periode','Jumlah (Rp)','Kasir'];
 const x=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>td,th{border:.5pt solid #999;font-family:Calibri;font-size:11pt;padding:3px;vertical-align:middle}th{background:#0F5C4D;color:#fff;font-weight:bold;text-align:center;height:26px}.t{border:none;font-size:16pt;font-weight:bold}.s{border:none;color:#555}.n{mso-number-format:"#,##0";text-align:right}.tt{background:#E1EFEA;font-weight:bold}.z{background:#F4F8F7}</style></head><body><table>
<col width=35><col width=130><col width=85><col width=55><col width=70><col width=170><col width=170><col width=170><col width=100><col width=120>
<tr><td class=t colspan=10>LAPORAN IURAN SAMPAH - ${e(s.nama)}</td></tr><tr><td class=s colspan=10>${e(s.alamat)}</td></tr><tr><td class=s colspan=10>Periode: ${$('d1').value} s/d ${$('d2').value}${$('kk').value?' | Kasir: '+e($('kk').value):''}</td></tr><tr><td class=s colspan=10></td></tr>
<tr>${H.map(i=>`<th>${i}</th>`).join('')}</tr>
${l.map((b,i)=>`<tr class="${i%2?'z':''}"><td align=center>${i+1}</td><td>${b.no}</td><td align=center>${b.tgl.slice(0,10)}</td><td align=center>${b.tgl.slice(11,16)}</td><td align=center>${b.wid}</td><td>${e(b.nama)}</td><td>${e(b.alamat)}</td><td>${b.periode.map(bln).join(', ')}</td><td class=n>${b.jumlah}</td><td>${e(b.kasir)}</td></tr>`).join('')}
<tr class=tt><td colspan=8 align=right>TOTAL PENERIMAAN</td><td class=n>${tot}</td><td></td></tr>
<tr><td class=s colspan=10></td></tr><tr><td class=t style="font-size:12pt" colspan=10>Rekap per kasir</td></tr>
${Object.entries(ks).map(([k,v])=>`<tr><td colspan=8>${e(k)}</td><td class=n>${v}</td><td></td></tr>`).join('')}
</table></body></html>`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+x],{type:'application/vnd.ms-excel'}));a.download=`Laporan-Iuran-Sampah_${$('d1').value}_sd_${$('d2').value}.xls`;a.click()}
V.pengguna=()=>{$('view').innerHTML=`<div class="grid"><section class="card"><h2>Tambah pengguna</h2><label>Nama lengkap</label><input id="un"><label>Username</label><input id="uu"><label>Password</label><input id="up" type="password"><label>Peran</label><select id="ur"><option value="kasir">Kasir (hanya halaman kasir)</option><option value="admin">Admin (akses penuh)</option></select><button onclick="tambahU()">Simpan pengguna</button></section><section class="card"><h2>Daftar pengguna</h2><div class="wrap"><table><tr><th>Nama</th><th>Username</th><th>Peran</th><th></th></tr>${db.users.map(u=>`<tr><td>${e(u.n)}</td><td>${e(u.u)}</td><td><span class="tag">${u.r}</span></td><td><button class="o s" onclick="resetU('${e(u.u)}')">Password</button> ${u.u!=me.u?`<button class="d s" onclick="hapusU('${e(u.u)}')">Hapus</button>`:''}</td></tr>`).join('')}</table></div></section></div>`};
async function tambahU(){const n=$('un').value.trim(),u=$('uu').value.trim().toLowerCase(),p=$('up').value;
 if(!n||!/^[a-z0-9._-]+$/.test(u)||p.length<6)return alert('Isi semua kolom. Username huruf kecil/angka tanpa spasi. Password minimal 6 karakter.');
 if(db.users.some(x=>x.u==u))return alert('Username sudah dipakai.');
 try{const em=NE(u),c=await AUTH2.createUserWithEmailAndPassword(em,p),b=FS.batch();b.set(FS.collection('users').doc(c.user.uid),{u,n,r:$('ur').value,aktif:true});b.set(FS.collection('uname').doc(u),{email:em});await b.commit();AUTH2.signOut();V.pengguna()}catch(x){alert('Gagal: '+x.message)}}
async function resetU(u){if(u==me.u)return alert('Untuk akun Anda sendiri, pakai Ganti password di Pengaturan.');const o=db.users.find(x=>x.u==u),p=prompt('Password baru untuk '+u+' (min. 6 karakter):');if(!p||p.length<6)return;
